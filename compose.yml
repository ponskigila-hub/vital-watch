services:
  vitalwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: vitalwatch:latest
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: sqlite:///api/runtime/vitalwatch.db
      ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      COOKIE_SECURE: "false"
      FRONTEND_DIST: /app/frontend/dist
    volumes:
      - vitalwatch-runtime:/app/api/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  vitalwatch-runtime:
